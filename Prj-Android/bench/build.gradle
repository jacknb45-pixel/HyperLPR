plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hyperai.example.lpr3_demo'
    compileSdk 31

    defaultConfig {
        // 与官方 demo（...lpr3_demo）区分：群内 APK 用官方 keystore 签名，本 APK 为
        // debug 签名，包名相同会因签名不一致导致安装失败。改包名后两者可共存。
        applicationId "com.hyperai.example.lpr3_bench"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0-bench"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    // Tools
    implementation 'org.greenrobot:eventbus:3.0.0'
    implementation 'com.github.smuyyh:ImageSelector:3.0'
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    // HyperLPR3 sdk
    implementation 'com.github.HyperInspire:hyperlpr3-android-sdk:1.0.3'

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}